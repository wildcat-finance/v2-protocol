name: Forge tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  forge-test:
    name: Forge test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Read Foundry version
        id: foundry
        run: echo "version=$(cat .foundry-version)" >> "$GITHUB_OUTPUT"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ steps.foundry.outputs.version }}
          cache: false

      - name: Run the full test suite
        run: forge test --summary

      - name: Verify canonical IR build sizes and KYC tests
        run: |
          FOUNDRY_PROFILE=ir forge build --sizes \
            src/providers/KYCRegistry.sol \
            src/providers/KYCRoleProvider.sol \
            src/providers/KYCRoleProviderFactory.sol
          python3 - <<'PY'
          import json
          for name in ('KYCRegistry', 'KYCRoleProvider', 'KYCRoleProviderFactory'):
            with open(f'ir-out/{name}.sol/{name}.json') as f:
              size = (len(json.load(f)['deployedBytecode']['object']) - 2) // 2
            assert size <= 24576, f'{name} exceeds EIP-170: {size} > 24576'
          PY
          FOUNDRY_PROFILE=ir forge test --match-path 'test/providers/*.t.sol' --summary
