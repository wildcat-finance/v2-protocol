[profile.default]
src = 'src'
test = 'test'
out = 'out'
libs = ['lib']
gas_reports = ["WildcatMarket"]

# Deliberately retain the Foundry 1.8.3 defaults used by the canonical suite.
# Top-level calls use separate transaction contexts, including storage warmth.
isolate = true
dynamic_test_linking = true

ffi=true
solc="0.8.25"
fs_permissions = [
  { access = "read-write", path = "./deployments/"},
  { access = "read-write", path = "./out/"},
  { access = "read-write", path = "./out-coverage/"},
  { access = "read-write", path = "./ir-out/"},
  { access = "read-write", path = "./deploy-out/"},
  { access = "read-write", path = "./deployments-old.json"}
]

remappings = [
  'forge-std/=lib/forge-std/src/',
  'solmate/=lib/solmate/src/',
  'solady/=lib/solady/src/',
  'openzeppelin/=lib/openzeppelin-contracts/'
]

evm_version = 'cancun'

ignored_warnings_from = ["src/", "test/"]
bytecode_hash = 'none'
via_ir = true
optimizer = true
# Runs 1 and the pinned Yul sequence without FunctionSpecializer keep both market
# runtimes below EIP-170. All normal build and test profiles inherit these settings.
optimizer_runs = 1
optimizer_details = { yulDetails = { optimizerSteps = 'dhfoDgvulfnTUtnIf[xa[r]EscLMcCTUtTOntnfDIulLculVcul [j]Tpeulxa[rul]xa[r]cLgvifCTUca[r]LSsTOtfDnca[r]Iulc]jmul[jul] VcTOcul jmul' } }
cbor_metadata = false

[fmt]
line_length = 120
tab_width = 2
bracket_spacing = true
quote_style = 'single'
multiline_func_header = 'all'
prefer_compact = 'none'
int_types = 'preserve'
number_underscore = 'preserve'
hex_underscore = 'preserve'
wrap_comments = false
docs_style = 'preserve'
single_line_statement_blocks = 'preserve'
sort_imports = false
namespace_import_style = 'preserve'

[lint]
lint_on_build = false

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

[profile.ir]
out='ir-out'
cache_path='ir-cache'
extra_output_files=["irOptimized", "ir"]

[profile.deploy]
out='deploy-out'
cache_path='deploy-cache'
extra_output_files=["irOptimized", "ir"]

# Accurate coverage needs a narrow discovery graph as well as the temporary
# SphereX analyzer workaround applied by `scripts/coverage.sh`. The empty
# source root prevents unrelated production graphs from entering focused runs.
[profile.coverage]
src='scripts/coverage-root'
test='test'
script='scripts/coverage-root'
out='out-coverage'
cache_path='cache-coverage'

[profile.coverage.fuzz]
runs = 10000

[profile.unoptimizedir]
via_ir=true
out='unoptimized-ir-out'
cache_path='unoptimized-ir-cache'
optimizer=false
extra_output_files=["irOptimized", "ir"]


[profile.default.fuzz]
runs = 1000

[invariant]
runs = 2000
depth = 30
fail_on_revert = false
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true
