[profile.default]
src = 'src'
# The vendored a16z erc4626-tests suite defines `testFail_*` tests, which newer
# foundry rejects outright. They are re-expressed with explicit revert
# expectations in test/vault/Wildcat4626WrapperStandard.t.sol.
no_match_test = 'testFail'
out = 'out'
libs = ['lib']
gas_reports = ["WildcatMarket"]

ffi=true
solc="0.8.25"
fs_permissions = [
  { access = "read-write", path = "./deployments/"},
  { access = "read-write", path = "./out/"},
  { access = "read-write", path = "./ir-out/"},
  { access = "read-write", path = "./deploy-out/"},
  { access = "read-write", path = "./deployments-old.json"}
]

remappings = [
  'forge-std/=lib/forge-std/src/',
  'ds-test/=lib/ds-test/src/',
  'solmate/=lib/solmate/src/',
  'solady/=lib/solady/src/',
  'sol-utils/=lib/sol-utils/src/',
  'openzeppelin/=lib/openzeppelin-contracts/',
  'ethereum-access-token/=lib/ethereum-access-token/contracts/'
]

evm_version = 'cancun'

ignored_warnings_from = ["src/", "test/"]
bytecode_hash = 'none'
via_ir = true
optimizer = true
optimizer_runs = 44
cbor_metadata = false

[profile.coverage.fuzz]
runs = 10000

[lint]
lint_on_build = false

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

[profile.ir]
out='ir-out'
cache_path='ir-cache'
extra_output_files=["irOptimized", "ir"]

[profile.deploy]
out='deploy-out'
cache_path='deploy-cache'
extra_output_files=["irOptimized", "ir"]

# Replacement test suite. This deliberately inherits the canonical compiler settings above;
# only discovery and artifact paths are isolated while we prove parity beside `test/`.
[profile.test-next]
test='test-next'
out='out-test-next'
cache_path='cache-test-next'

# Accurate coverage needs a narrow discovery graph as well as the temporary
# SphereX analyzer workaround applied by `scripts/test-next-coverage.sh`.
[profile.test-next-coverage]
src='test-next/parity'
test='test-next'
script='test-next/parity'
out='out-test-next-coverage'
cache_path='cache-test-next-coverage'

[profile.unoptimizedir]
via_ir=true
out='unoptimized-ir-out'
cache_path='unoptimized-ir-cache'
optimizer=false
extra_output_files=["irOptimized", "ir"]


[profile.default.fuzz]
runs = 1000

[invariant]
runs = 2000
depth = 30
fail_on_revert = false
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true
