[profile.default]
libraries = [
  'src/access/covenants/lib/CrossMarketGateLib.sol:CrossMarketGateLib:0x1c6f2EbF304E87AA8AB9e3f8E916360d00C6F404',
  'src/access/covenants/lib/CleanDownLib.sol:CleanDownLib:0xEfE248377801886F5EB1eD8Fa3511f2Be4f975eD',
  'src/access/covenants/lib/CommitmentScheduleLib.sol:CommitmentScheduleLib:0x06AE339781C3bb2edd0039a8A66Ea75e74dFB9Eb',
  'src/access/covenants/lib/DrawTimelockLib.sol:DrawTimelockLib:0xb290005F652E8989c8341709c24387bc2B0b60a7',
  'src/access/covenants/lib/BorrowingBaseLib.sol:BorrowingBaseLib:0x0534D8c7B743e7bF9C9D319A567D77FA0880aE21',
  'src/access/covenants/lib/CrossMarketCapLib.sol:CrossMarketCapLib:0xA8ccf7e3241a86920A0Dea46274c95E7369c998c'
]
src = 'src'
# The vendored a16z erc4626-tests suite defines `testFail_*` tests, which newer
# foundry rejects outright. They are re-expressed with explicit revert
# expectations in test/vault/Wildcat4626WrapperStandard.t.sol.
no_match_test = 'testFail'
out = 'out'
libs = ['lib']
gas_reports = ["WildcatMarket"]

ffi=true
solc="0.8.25"
fs_permissions = [
  { access = "read-write", path = "./deployments/"},
  { access = "read-write", path = "./out/"},
  { access = "read-write", path = "./ir-out/"},
  { access = "read-write", path = "./deploy-out/"},
  { access = "read-write", path = "./deployments-old.json"}
]

remappings = [
  'forge-std/=lib/forge-std/src/',
  'ds-test/=lib/ds-test/src/',
  'solmate/=lib/solmate/src/',
  'solady/=lib/solady/src/',
  'sol-utils/=lib/sol-utils/src/',
  'openzeppelin/=lib/openzeppelin-contracts/',
  'ethereum-access-token/=lib/ethereum-access-token/contracts/'
]

evm_version = 'cancun'

ignored_warnings_from = ["src/", "test/"]
bytecode_hash = 'none'

[profile.coverage.fuzz]
runs = 10000

[lint]
lint_on_build = false

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

[profile.ir]
libraries = [
  'src/access/covenants/lib/CrossMarketGateLib.sol:CrossMarketGateLib:0x1c6f2EbF304E87AA8AB9e3f8E916360d00C6F404',
  'src/access/covenants/lib/CleanDownLib.sol:CleanDownLib:0xEfE248377801886F5EB1eD8Fa3511f2Be4f975eD',
  'src/access/covenants/lib/CommitmentScheduleLib.sol:CommitmentScheduleLib:0x06AE339781C3bb2edd0039a8A66Ea75e74dFB9Eb',
  'src/access/covenants/lib/DrawTimelockLib.sol:DrawTimelockLib:0xb290005F652E8989c8341709c24387bc2B0b60a7',
  'src/access/covenants/lib/BorrowingBaseLib.sol:BorrowingBaseLib:0x0534D8c7B743e7bF9C9D319A567D77FA0880aE21',
  'src/access/covenants/lib/CrossMarketCapLib.sol:CrossMarketCapLib:0xA8ccf7e3241a86920A0Dea46274c95E7369c998c'
]
via_ir=true
out='ir-out'
cache_path='ir-cache'
# optimizer_runs=4_294_967_295
optimizer_runs=50_000
optimizer=true
extra_output_files=["irOptimized", "ir"]
bytecode_hash = 'none'

[profile.deploy]
libraries = [
  'src/access/covenants/lib/CrossMarketGateLib.sol:CrossMarketGateLib:0x1c6f2EbF304E87AA8AB9e3f8E916360d00C6F404',
  'src/access/covenants/lib/CleanDownLib.sol:CleanDownLib:0xEfE248377801886F5EB1eD8Fa3511f2Be4f975eD',
  'src/access/covenants/lib/CommitmentScheduleLib.sol:CommitmentScheduleLib:0x06AE339781C3bb2edd0039a8A66Ea75e74dFB9Eb',
  'src/access/covenants/lib/DrawTimelockLib.sol:DrawTimelockLib:0xb290005F652E8989c8341709c24387bc2B0b60a7',
  'src/access/covenants/lib/BorrowingBaseLib.sol:BorrowingBaseLib:0x0534D8c7B743e7bF9C9D319A567D77FA0880aE21',
  'src/access/covenants/lib/CrossMarketCapLib.sol:CrossMarketCapLib:0xA8ccf7e3241a86920A0Dea46274c95E7369c998c'
]
via_ir=true
out='deploy-out'
cache_path='deploy-cache'
optimizer_runs=200
optimizer=true
extra_output_files=["irOptimized", "ir"]
bytecode_hash = 'none'

[profile.unoptimizedir]
via_ir=true
out='unoptimized-ir-out'
cache_path='unoptimized-ir-cache'
optimizer=false
extra_output_files=["irOptimized", "ir"]


[profile.default.fuzz]
runs = 1000

[invariant]
runs = 2000
depth = 30
fail_on_revert = false
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true
